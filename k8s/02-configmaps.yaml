apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: rowad-ecommerce
    app.kubernetes.io/part-of: rowad-ecommerce-platform
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "30d"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  PRODUCT_SERVICE_URL: "http://product-search-service:5002"
  PAYMENT_SERVICE_URL: "http://payment-service:5003"
  CART_SERVICE_URL: "http://cart-service:5004"
  FRONTEND_URL: "http://frontend"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rowad-ecommerce-platform
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Kubernetes CoreDNS resolver: allows dynamic backend resolution
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # ---------- API gateway: In-cluster routing ----------
        location /api/auth/ {
            set $u http://auth-user-service.rowad-ecommerce.svc.cluster.local:5001;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            set $u http://auth-user-service.rowad-ecommerce.svc.cluster.local:5001;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/products {
            set $u http://product-search-service.rowad-ecommerce.svc.cluster.local:5002;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/categories {
            set $u http://product-search-service.rowad-ecommerce.svc.cluster.local:5002;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/payment/ {
            set $u http://payment-service.rowad-ecommerce.svc.cluster.local:5003;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/cart {
            set $u http://cart-service.rowad-ecommerce.svc.cluster.local:5004;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/orders {
            set $u http://order-service.rowad-ecommerce.svc.cluster.local:5005;
            proxy_pass $u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------- Single Page App (SPA) ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }
