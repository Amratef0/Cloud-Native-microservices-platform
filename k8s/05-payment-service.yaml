apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: rowad-ecommerce-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: judyassem0/rowad-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5003"
            - name: ConnectionStrings__DefaultConnection
              value: "Data Source=/app/data/payments.db"
            - name: PaymentGateway__AutoApproveThreshold
              value: "10000.00"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: payment-storage
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: payment-storage
          persistentVolumeClaim:
            claimName: payment-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: rowad-ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003
