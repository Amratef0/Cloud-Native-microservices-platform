apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-user-service
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: auth-user-service
    app.kubernetes.io/part-of: rowad-ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-user-service
  template:
    metadata:
      labels:
        app: auth-user-service
    spec:
      containers:
        - name: auth-user-service
          image: judyassem0/rowad-auth-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PORT
              value: "5001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: jwt-secret
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: JWT_EXPIRES_IN
            - name: MONGO_URI
              value: "mongodb://mongo:27017/ecommerce_auth_db"
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: FRONTEND_URL
            - name: BREVO_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: brevo-smtp-user
                  optional: true
            - name: BREVO_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: brevo-smtp-pass
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-user-service
  namespace: rowad-ecommerce
  labels:
    app.kubernetes.io/name: auth-user-service
    app.kubernetes.io/part-of: rowad-ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app: auth-user-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
